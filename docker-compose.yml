services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pptlibrary}
      POSTGRES_USER: ${POSTGRES_USER:-pptlibrary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pptlibrary}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pptlibrary} -d ${POSTGRES_DB:-pptlibrary}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"

  api:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.api
    environment: &app_env
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-localhost:19000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-dGVzdC1tYXN0ZXIta2V5LTEyMzQ1Njc4OTAxMjM0NTY=}
      MINERU_API_URL: ${MINERU_API_URL:-http://host.docker.internal:8765}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    # Run migrations on startup, then start gunicorn
    command: >
      sh -c "alembic upgrade head &&
             gunicorn app.main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 -w 2 --timeout 120"

  worker-basic:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.worker-basic
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-render:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.worker-render
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-mineru:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.worker-basic
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_app worker -Q mineru --concurrency=1
      --loglevel=info -n mineru@%h

  worker-ai:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.worker-basic
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_app worker -Q ai --concurrency=2
      --loglevel=info -n ai@%h

  web:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:18000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:18000}
      NEXTAUTH_URL: http://localhost:13000
    depends_on:
      - api
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    command: sh -c "npm run db:seed-mock && npm run start"

volumes:
  postgres_data:
  minio_data:
